# Layanan Aisha Monitor sesuai SRS 2.3: Laravel (PHP-FPM), Nginx, MySQL,
# Redis, queue worker, scheduler, dan Gotenberg. Nilai rahasia dibaca dari .env.

name: aisha-monitor

x-app: &app
  image: aisha-monitor-app:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: app
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    GOTENBERG_URL: http://gotenberg:3000
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal
  restart: unless-stopped

services:
  app:
    <<: *app

  # FR-58: pengiriman gagal dicoba ulang paling banyak 3 kali.
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=60", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  web:
    image: aisha-monitor-web:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    # Trigger audit append-only dibuat oleh akun aplikasi, bukan root.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  # Hanya dapat diakses dari jaringan internal Docker (SRS 4.2).
  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - internal
    restart: unless-stopped

volumes:
  storage:
  mysql-data:
  redis-data:

networks:
  internal:
